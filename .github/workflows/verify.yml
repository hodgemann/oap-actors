name: Verify actors

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "open-actor-protocol @ git+https://github.com/hodgemann/oap@v0.3.0"
      - run: python tools/verify_collection.py
